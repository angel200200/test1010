<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蝦皮系統維護中</title>
    <style>
        body {
            background: #fff3e6;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
            margin: 0;
        }
        .box {
            background: white;
            padding: 40px 25px;
            border-radius: 20px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        img {
            width: 100%;
            max-width: 250px;
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            color: #f06a2d;
        }
        p {
            color: #666;
            line-height: 1.8;
        }
        button {
            background: #f06a2d;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="sorry.png" alt="系統維護插圖">
        <h1>🧡系統維護中</h1>
        <p>
            非常抱歉造成不便！<br>
            我們正在努力修復，請稍候片刻。
        </p>
        <button onclick="alert('系統仍在維護中，請稍後再試！')">
            重新確認
        </button>
    </div>
</body>
</html>
